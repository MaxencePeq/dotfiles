# Personal additions, sourced at the end of tmux.conf (not part of craftzdog's repo).

# Same actions as prefix c / n / p, without releasing Ctrl after the C-t prefix
bind C-c new-window -c "#{pane_current_path}"
bind C-n next-window
bind C-p previous-window

# Switch windows without the prefix (C-S-Left/Right in bindings.conf already move the window itself)
bind -n S-Left previous-window
bind -n S-Right next-window
